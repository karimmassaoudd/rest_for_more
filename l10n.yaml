# Flutter translations (gen-l10n). Put this file in the PROJECT ROOT,
# next to pubspec.yaml. Generated code lands in lib/l10n/.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
# AppLocalizations.of(context) returns a non-null value (no "!" needed).
nullable-getter: false
