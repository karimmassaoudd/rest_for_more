name: flutter_application_rest_for_more
description: "Rest For More: focus sessions that block distracting apps."
publish_to: "none" # Private app, never published to pub.dev.

# versionName+versionCode (Android) / CFBundleShortVersionString+CFBundleVersion (iOS)
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Navigation & UI
  go_router: ^18.0.1
  cupertino_icons: ^1.0.8

  # Storage & localisation
  shared_preferences: ^2.5.6
  intl: any # Version is pinned by flutter_localizations.

  # Focus sessions: notifications, alarms and the iOS live activity
  flutter_local_notifications: ^19.0.0
  alarm: ^5.15.0
  live_activity_kit: ^1.1.1

  # Our modified copy of the app_blocker plugin (Android + iOS app blocking)
  app_blocker:
    path: app_blocker_modified/app_blocker

  # Authentication (beta: pinned on purpose, keep both on the same version)
  clerk_flutter: 0.0.18-beta
  clerk_auth: 0.0.18-beta # Used for Strategy and error types.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0 # Rules are set in analysis_options.yaml.
  flutter_launcher_icons: ^0.14.4

# Run `dart run flutter_launcher_icons` to regenerate the app icons.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/rfm_logo_transparent_bg.png"
  remove_alpha_ios: true

flutter:
  generate: true # Generates lib/l10n/app_localizations*.dart from the .arb files.
  uses-material-design: true

  assets:
    - assets/images/
    - assets/mascot/
  fonts:
    - family: CormorantGaramond
      fonts:
        - asset: assets/fonts/CormorantGaramond-Light.ttf
          weight: 300
        - asset: assets/fonts/CormorantGaramond-Regular.ttf
          weight: 400
        - asset: assets/fonts/CormorantGaramond-Medium.ttf
          weight: 500
        - asset: assets/fonts/CormorantGaramond-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/CormorantGaramond-Bold.ttf
          weight: 700
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-ExtraBold.ttf
          weight: 800
